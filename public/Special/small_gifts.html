<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Gifts | Private Archive</title>
    <link rel="icon" type="image/jpeg" href="../yash.jpg">
    <link rel="stylesheet" href="../style.css?v=4.6">
    <style>
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1150px;
            margin: 24px auto 0 auto;
            padding: 0 20px;
        }
        .filter-nav { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.12); padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.25s; font-size: 0.9rem; }
        .filter-btn.active { background: var(--accent-gold); color: #000; font-weight: 700; border-color: var(--accent-gold); }
        .gift-card { background: rgba(10, 20, 28, 0.82); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.25s ease, border-color 0.25s ease; display: flex; flex-direction: column; }
        .gift-card:hover { transform: translateY(-4px); border-color: var(--accent-gold); }
        .gift-card.audio-card { cursor: default; padding: 20px 18px; justify-content: space-between; gap: 14px; border-top: 3px solid var(--accent-gold); }
        .gift-card img, .gift-card video { width: 100%; height: 260px; object-fit: cover; display: block; border-bottom: 2px solid var(--accent-gold); background: rgba(4, 10, 16, 0.9); }
        .gift-caption { padding: 14px 16px; color: var(--text-main); font-size: 0.95rem; line-height: 1.45; }
        .audio-header { display: flex; align-items: center; gap: 14px; }
        .audio-icon-circle { width: 48px; height: 48px; border-radius: 50%; background: rgba(212, 175, 55, 0.14); border: 1px solid var(--accent-gold); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
        .audio-title { font-size: 1.02rem; font-weight: 600; color: #fff; word-break: break-word; }
        .audio-sub { font-size: 0.78rem; color: var(--accent-gold); margin-top: 3px; word-break: break-word; }
        .gift-audio-player { width: 100%; height: 42px; accent-color: var(--accent-gold); }
        .video-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.78); color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 3px 9px; border-radius: 5px; font-size: 0.78rem; font-weight: 600; pointer-events: none; }
        .lb-note { margin-top: 12px; background: rgba(10, 20, 28, 0.92); border: 1px solid var(--accent-gold); color: #fff; padding: 10px 20px; border-radius: 8px; max-width: 82vw; text-align: center; font-size: 0.95rem; }
        .missing-badge { padding: 28px 16px; text-align: center; color: var(--text-muted); font-size: 0.84rem; background: rgba(0,0,0,0.45); border-bottom: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <canvas id="bg-canvas-particles"></canvas>

    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
        <div id="lightbox-content-container" style="display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div class="top-bar">
        <a href="../family.html?hub=1" style="text-decoration:none;">
            <button class="secondary-btn" style="padding:8px 16px !important;">← Back to Hub</button>
        </a>
    </div>

    <section class="content-section" style="margin-top: 15px;">
        <div id="gate-blocked" class="card" style="display:none; max-width:420px; margin:60px auto; text-align:center;">
            <h2 style="margin-bottom:10px;">Restricted</h2>
            <p style="color:var(--text-muted); margin-bottom:20px;">Open this archive from the Family Vault first.</p>
            <a href="../family.html" style="text-decoration:none;"><button>Go to Family Vault</button></a>
        </div>

        <div id="gifts-app" style="display:none;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 2.8rem; margin-bottom: 8px;">Small Gifts</h1>
                <p style="color: var(--text-muted); font-size: 1.05rem;">
                    Pamphlets, creations, pictures, videos &amp; voice notes made for every monthly milestone.
                </p>
            </div>

            <div class="filter-nav">
                <div class="filter-btn active" onclick="window.filterGifts('all', this)">All Creations</div>
                <div class="filter-btn" onclick="window.filterGifts('image', this)">Pamphlets &amp; Images</div>
                <div class="filter-btn" onclick="window.filterGifts('video', this)">Videos</div>
                <div class="filter-btn" onclick="window.filterGifts('audio', this)">🎵 Audio</div>
            </div>

            <div id="gifts-grid" class="gallery-grid">
                <p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">Loading archive...</p>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCrR6sGSwG4i8GD3yVi0S7XIVIFA5O3C-8", authDomain: "yash-jangid.firebaseapp.com", projectId: "yash-jangid", storageBucket: "yash-jangid.firebasestorage.app", messagingSenderId: "413356747209", appId: "1:413356747209:web:5b7332a06e3865f6e5a018", measurementId: "G-BR856TNGE8" };
        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let ghBase = "";
        let repoRelativePaths = []; // Auto-discovered file paths inside public/ (including nested subfolders)
        let allGifts = [];
        let activeFilter = "all";

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }

        function normalizeFile(rawUrl) {
            let s = String(rawUrl || '').trim().replace(/\\/g, '/');
            if (/^https?:\/\//i.test(s)) return s;
            const pubIdx = s.toLowerCase().lastIndexOf('/public/');
            if (pubIdx !== -1) s = s.slice(pubIdx + 8);
            return s.replace(/^\/+/, '');
        }

        function encodePath(pathStr) {
            return String(pathStr || '').split('/').map(seg => encodeURIComponent(seg)).join('/');
        }

        function getMediaType(item) {
            const clean = (item.url || '').split('?')[0];
            if (item.type === 'audio' || /\.(mp3|m4a|wav|ogg|aac|flac|opus)$/i.test(clean)) return 'audio';
            if (item.type === 'video' || /\.(mp4|webm|mov|mkv)$/i.test(clean)) return 'video';
            return 'image';
        }

        // Auto-discovers every file inside any subfolder in your GitHub repo so nested folders always load
        async function loadGitHubTree(user, repo, branch, folderPrefix) {
            const cacheKey = `gh_tree_${user}_${repo}_${branch}`;
            try {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) {
                    repoRelativePaths = JSON.parse(cached);
                    return;
                }
                const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(user)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
                if (!res.ok) return;
                const data = await res.json();
                if (!Array.isArray(data.tree)) return;

                const pref = folderPrefix ? folderPrefix.replace(/^\/+|\/+$/g, '') + '/' : '';
                const prefLower = pref.toLowerCase();
                repoRelativePaths = data.tree
                    .filter(node => node.type === 'blob' && (!pref || node.path.toLowerCase().startsWith(prefLower)))
                    .map(node => pref ? node.path.slice(pref.length) : node.path);

                sessionStorage.setItem(cacheKey, JSON.stringify(repoRelativePaths));
            } catch (e) {}
        }

        function findTreeMatches(clean) {
            if (repoRelativePaths.length === 0) return [];
            const targetLower = clean.toLowerCase();
            const baseLower = targetLower.split('/').pop();

            const exact = [];
            const suffix = [];
            const byName = [];

            for (const p of repoRelativePaths) {
                const pl = p.toLowerCase();
                if (pl === targetLower) exact.push(p);
                else if (pl.endsWith('/' + targetLower)) suffix.push(p);
                else if (pl.split('/').pop() === baseLower) byName.push(p);
            }

            // Prefer files inside Special/Gifts/ or Special/ first
            const scorePath = (p) => {
                const l = p.toLowerCase();
                if (l.startsWith('special/gifts/')) return 0;
                if (l.startsWith('special/small')) return 1;
                if (l.startsWith('special/')) return 2;
                if (l.startsWith('audios/')) return 3;
                return 4;
            };
            suffix.sort((a, b) => scorePath(a) - scorePath(b));
            byName.sort((a, b) => scorePath(a) - scorePath(b));

            return [...exact, ...suffix, ...byName];
        }

        function buildMediaCandidates(rawUrl) {
            const clean = normalizeFile(rawUrl);
            if (/^https?:\/\//i.test(clean)) return [clean];

            const base = clean.split('/').pop();
            const list = [];

            // 1. Exact auto-discovered matches from any nested subfolder in GitHub repo
            const treeHits = findTreeMatches(clean);
            treeHits.forEach(hit => {
                if (ghBase) list.push(ghBase + encodePath(hit));
                list.push(`../${encodePath(hit)}`);
            });

            // 2. Preserve user-provided subfolder paths across common roots (GitHub + Local)
            const prefixes = [
                'Special/Gifts/',
                'Special/gifts/',
                'Special/Small Gifts/',
                'Special/Assets/',
                'Special/Audios/',
                'Special/',
                'Audios/',
                ''
            ];

            if (ghBase) {
                prefixes.forEach(pre => list.push(ghBase + encodePath(pre + clean)));
                if (clean !== base) {
                    prefixes.forEach(pre => list.push(ghBase + encodePath(pre + base)));
                }
            }

            // Local Firebase Hosting fallbacks (relative to /Special/small_gifts.html)
            list.push(encodePath(`Gifts/${clean}`));
            list.push(encodePath(`gifts/${clean}`));
            list.push(encodePath(`Small Gifts/${clean}`));
            list.push(encodePath(clean));
            list.push(`../${encodePath(clean)}`);
            if (clean !== base) {
                list.push(encodePath(`Gifts/${base}`));
                list.push(encodePath(`Assets/${base}`));
                list.push(encodePath(base));
                list.push(`../Audios/${encodePath(base)}`);
                list.push(`../${encodePath(base)}`);
            }

            return [...new Set(list)];
        }

        window.stepFallback = function(el) {
            const cands = JSON.parse(el.dataset.cands || "[]");
            const nextIdx = parseInt(el.dataset.cidx || "0", 10) + 1;
            if (nextIdx < cands.length) {
                el.dataset.cidx = String(nextIdx);
                el.src = cands[nextIdx];
            } else if (el.tagName === 'IMG' && !el.dataset.failedShown) {
                el.dataset.failedShown = '1';
                const notice = document.createElement('div');
                notice.className = 'missing-badge';
                notice.innerHTML = `⚠️ File not found on GitHub/Hosting:<br><code style="color:var(--accent-gold);">${escapeHTML(el.dataset.raw || '')}</code>`;
                el.replaceWith(notice);
            }
        };

        window.openLightbox = function(cands, type, caption) {
            const container = document.getElementById('lightbox-content-container');
            const encodedCands = escapeHTML(JSON.stringify(cands));
            const firstSrc = escapeHTML(cands[0] || '');
            const capHTML = caption ? `<div class="lb-note">${escapeHTML(caption)}</div>` : '';
            if (type === 'video') {
                container.innerHTML = `<video src="${firstSrc}" data-cands="${encodedCands}" data-cidx="0" onerror="window.stepFallback(this)" controls autoplay style="max-width:90vw; max-height:82vh; border-radius:8px;"></video>${capHTML}`;
            } else {
                container.innerHTML = `<img src="${firstSrc}" data-cands="${encodedCands}" data-cidx="0" onerror="window.stepFallback(this)" style="max-width:90vw; max-height:82vh; object-fit:contain; border-radius:8px;">${capHTML}`;
            }
            document.getElementById('lightbox').style.display = 'flex';
        };

        window.closeLightbox = function(e) {
            if (e && e.target && e.target.tagName === 'VIDEO') return;
            document.getElementById('lightbox-content-container').innerHTML = '';
            document.getElementById('lightbox').style.display = 'none';
        };
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.closeLightbox(); });

        window.filterGifts = function(f, btn) {
            activeFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderGifts();
        };

        function renderGifts() {
            const grid = document.getElementById('gifts-grid');
            const list = allGifts.filter(item => {
                const t = getMediaType(item);
                return activeFilter === 'all' || activeFilter === t;
            });

            if (list.length === 0) {
                grid.innerHTML = `<div class="card" style="grid-column:1/-1; text-align:center; color:var(--text-muted);">No items found in this category yet.</div>`;
                return;
            }

            grid.innerHTML = list.map((item, idx) => {
                const mType = getMediaType(item);
                const cands = buildMediaCandidates(item.url);
                const enc = escapeHTML(JSON.stringify(cands));
                const cap = escapeHTML(item.caption || '');
                const rawName = escapeHTML(item.url || '');

                if (mType === 'audio') {
                    const displayTitle = cap || escapeHTML((item.url || 'Audio Gift').split('/').pop().replace(/\.[^/.]+$/, ''));
                    return `
                        <div class="gift-card audio-card">
                            <div class="audio-header">
                                <div class="audio-icon-circle">🎵</div>
                                <div>
                                    <div class="audio-title">${displayTitle}</div>
                                    <div class="audio-sub">${rawName}</div>
                                </div>
                            </div>
                            <audio class="gift-audio-player" controls preload="metadata" src="${escapeHTML(cands[0] || '')}" data-cands="${enc}" data-cidx="0" onerror="window.stepFallback(this)"></audio>
                        </div>
                    `;
                }

                if (mType === 'video') {
                    return `
                        <div class="gift-card openable-card" data-idx="${idx}">
                            <div style="position:relative;">
                                <video src="${escapeHTML(cands[0] || '')}" data-cands="${enc}" data-cidx="0" onerror="window.stepFallback(this)" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>
                                <span class="video-tag">▶ Video</span>
                            </div>
                            ${cap ? `<div class="gift-caption">${cap}</div>` : ''}
                        </div>
                    `;
                }

                const firstThumb = item.thumbData ? escapeHTML(item.thumbData) : escapeHTML(cands[0] || '');
                return `
                    <div class="gift-card openable-card" data-idx="${idx}">
                        <img loading="lazy" src="${firstThumb}" data-raw="${rawName}" data-cands="${enc}" data-cidx="${item.thumbData ? '-1' : '0'}" onerror="window.stepFallback(this)" alt="${cap || 'Gift'}">
                        ${cap ? `<div class="gift-caption">${cap}</div>` : ''}
                    </div>
                `;
            }).join('');

            // Lightbox for images & videos
            grid.querySelectorAll('.openable-card').forEach(card => {
                card.addEventListener('click', () => {
                    const item = list[parseInt(card.dataset.idx, 10)];
                    if (!item) return;
                    window.openLightbox(buildMediaCandidates(item.url), getMediaType(item), item.caption || '');
                });
            });

            // Pause other audio players when one starts playing
            const players = grid.querySelectorAll('audio.gift-audio-player');
            players.forEach(p => {
                p.addEventListener('play', () => {
                    players.forEach(other => { if (other !== p && !other.paused) other.pause(); });
                });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user || sessionStorage.getItem('sp_unlocked') !== '1') {
                document.getElementById('gate-blocked').style.display = 'block';
                return;
            }
            document.getElementById('gifts-app').style.display = 'block';
            try {
                const cfg = await getDoc(doc(db, "site_config", "github"));
                if (cfg.exists() && cfg.data().enabled && cfg.data().user && cfg.data().repo) {
                    const d = cfg.data();
                    const branch = d.branch || 'main';
                    const folder = d.folder ? d.folder.replace(/^\/+|\/+$/g, '') + '/' : '';
                    ghBase = `https://raw.githubusercontent.com/${d.user}/${d.repo}/${branch}/${folder}`;
                    await loadGitHubTree(d.user, d.repo, branch, d.folder || '');
                }
            } catch (e) {}

            onSnapshot(collection(db, "special_gifts"), (snap) => {
                allGifts = [];
                snap.forEach(d => allGifts.push({ id: d.id, ...d.data() }));
                allGifts.sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));
                renderGifts();
            });
        });
    </script>
    <script>
        (function initConstellation() {
            const canvas = document.getElementById('bg-canvas-particles');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            for (let i = 0; i < 55; i++) {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.45, vy: (Math.random() - 0.5) * 0.45, r: Math.random() * 1.8 + 0.8 });
            }
            function animate() {
                if (document.hidden) return requestAnimationFrame(animate);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.75)'; ctx.fill();
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
