<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Results | Yash Jangid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="achievements.html">Achievements</a>
            <a href="muns.html">MUNs</a>
            <a href="results.html" class="active">Results</a>
            <a href="secret.html">Secret Vault</a>
        </div>
    </nav>

    <section class="content-section">
        <h2>Live Results Directory</h2>
        <div id="dynamic-results-container">
            <p>Loading live data...</p>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrR6sGSwG4i8GD3yVi0S7XIVIFA5O3C-8",
            authDomain: "yash-jangid.firebaseapp.com",
            projectId: "yash-jangid",
            storageBucket: "yash-jangid.firebasestorage.app",
            messagingSenderId: "413356747209",
            appId: "1:413356747209:web:5b7332a06e3865f6e5a018",
            measurementId: "G-BR856TNGE8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const eventsRef = collection(db, "mun_events");
        onSnapshot(eventsRef, (eventsSnapshot) => {
            const container = document.getElementById("dynamic-results-container");
            container.innerHTML = ""; 

            if (eventsSnapshot.empty) {
                container.innerHTML = "<p>No results have been uploaded yet.</p>";
                return;
            }

            eventsSnapshot.forEach((eventDoc) => {
                const data = eventDoc.data();
                
                const card = document.createElement('div');
                card.className = 'card';
                card.style.marginTop = '20px';
                
                let html = `<h3>${data.displayName}</h3>`;
                
                // If Excel data exists, dynamically build the exact table
                if (data.excelData && data.excelData.length > 0) {
                    const headers = data.excelData[0];
                    const rows = data.excelData.slice(1);
                    
                    html += `<div style="overflow-x: auto;"><table><thead><tr>`;
                    
                    // Generate Headers exactly as they appear in Excel
                    headers.forEach(headerText => { 
                        html += `<th>${headerText}</th>`; 
                    });
                    
                    html += `</tr></thead><tbody>`;
                    
                    // Generate Rows
                    rows.forEach(row => {
                        html += `<tr>`;
                        for (let i = 0; i < headers.length; i++) {
                            html += `<td>${row[i] !== undefined ? row[i] : ''}</td>`;
                        }
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div>`;
                } else {
                    html += `<p style="color: #666; font-style: italic;">No Excel data uploaded yet.</p>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
