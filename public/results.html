<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Results | Yash Jangid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }
        
        .card th, .card td {
            padding: 12px 16px;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 10px;
            border: 1px solid #e1e1e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="achievements.html">Achievements</a>
            <a href="muns.html">MUNs</a>
            <a href="results.html" class="active">Results</a>
            <a href="secret.html">Secret Vault</a>
        </div>
    </nav>

    <section class="content-section">
        <h2>Live Results Directory</h2>
        <div id="dynamic-results-container">
            <p>Loading live data...</p>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrR6sGSwG4i8GD3yVi0S7XIVIFA5O3C-8",
            authDomain: "yash-jangid.firebaseapp.com",
            projectId: "yash-jangid",
            storageBucket: "yash-jangid.firebasestorage.app",
            messagingSenderId: "413356747209",
            appId: "1:413356747209:web:5b7332a06e3865f6e5a018",
            measurementId: "G-BR856TNGE8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const eventsRef = collection(db, "mun_events");
        onSnapshot(eventsRef, (eventsSnapshot) => {
            const container = document.getElementById("dynamic-results-container");
            container.innerHTML = ""; 

            if (eventsSnapshot.empty) {
                container.innerHTML = "<p>No results have been uploaded yet.</p>";
                return;
            }

            let eventsArray = [];
            eventsSnapshot.forEach((doc) => {
                eventsArray.push({ id: doc.id, ...doc.data() });
            });

            eventsArray.sort((a, b) => {
                const orderA = a.orderIndex !== undefined ? a.orderIndex : 0;
                const orderB = b.orderIndex !== undefined ? b.orderIndex : 0;
                if (orderA !== orderB) {
                    return orderA - orderB;
                }
                return a.id.localeCompare(b.id);
            });

            eventsArray.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.marginTop = '20px';
                
                let html = `<h3>${data.displayName}</h3>`;
                
                if (data.excelData && data.excelData.length > 0) {
                    const headers = data.excelData[0].rowData;
                    const rows = data.excelData.slice(1);
                    const highlights = data.highlights || [];

                    // Identify column indexes to highlight
                    let highlightedColIndexes = [];
                    highlights.forEach(hl => {
                        if (hl.type === 'column') {
                            const colIdx = headers.findIndex(h => h.toLowerCase() === hl.target.toLowerCase());
                            if (colIdx !== -1) {
                                highlightedColIndexes.push({ index: colIdx, color: hl.color });
                            }
                        }
                    });

                    html += `<div class="table-responsive"><table><thead><tr>`;
                    
                    headers.forEach((headerText, colIdx) => {
                        let thStyle = "";
                        highlightedColIndexes.forEach(hl => {
                            if (hl.index === colIdx) thStyle = `style="background-color: ${hl.color}; color: #000;"`;
                        });
                        html += `<th ${thStyle}>${headerText}</th>`;
                    });
                    
                    html += `</tr></thead><tbody>`;
                    
                    rows.forEach((rowObj, rowIdx) => {
                        // Check if this specific row is targeted (rowIdx + 1 because index 0 is headers)
                        let rowBgColor = "";
                        highlights.forEach(hl => {
                            if (hl.type === 'row' && parseInt(hl.target) === (rowIdx + 1)) {
                                rowBgColor = `background-color: ${hl.color}; color: #000;`;
                            }
                        });

                        html += `<tr style="${rowBgColor}">`;
                        const rowData = rowObj.rowData;

                        for (let i = 0; i < headers.length; i++) {
                            let cellStyle = "";
                            // Check if cell belongs to a highlighted column
                            highlights.forEach(hl => {
                                if (hl.type === 'column') {
                                    const colIdx = headers.findIndex(h => h.toLowerCase() === hl.target.toLowerCase());
                                    if (colIdx === i && !rowBgColor) {
                                        cellStyle = `style="background-color: ${hl.color}; color: #000;"`;
                                    }
                                }
                            });

                            html += `<td ${cellStyle}>${rowData[i] !== undefined ? rowData[i] : ''}</td>`;
                        }
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div>`;
                } else {
                    html += `<p style="color: #666; font-style: italic;">No Excel data uploaded yet.</p>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
