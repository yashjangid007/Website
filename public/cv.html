<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUN CV | Yash Jangid</title>
    <link rel="icon" type="image/jpeg" href="yash.jpg">
    <link rel="stylesheet" href="style.css?v=4.0">
    <style>
        .cv-container { max-width: 900px; margin: 0 auto; text-align: center; }
        .cv-image {
            width: 100%; height: auto; border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.15);
            border: 2px solid var(--accent-gold); display: block;
            transition: transform 0.3s ease; cursor: zoom-in;
        }
        .cv-image:hover { transform: scale(1.015); }
    </style>
</head>
<body>
    <canvas id="bg-canvas-particles"></canvas>

    <nav class="navbar">
        <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="cv.html" class="active">MUN CV</a>
            <a href="lors.html">LORs</a>
            <a href="achievements.html">Achievements</a>
            <a href="muns.html">MUNs</a>
            <a href="projects.html">Projects</a>
            <a href="graphics.html">Graphics</a>
            <a href="results.html">Results</a>
            <a href="family.html">My Real Family</a>
            <a href="secret.html">Secret Vault</a>
        </div>
    </nav>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Fullscreen CV">
    </div>

    <section class="content-section" style="margin-top: 40px;">
        <div class="cv-container">
            <img src="your_cv_image.png" alt="Yash Jangid - MUN Curriculum Vitae" class="cv-image" onclick="openLightbox(this.src)">
            <div style="margin-top: 25px;">
                <a href="your_cv_image.png" download="Yash_Jangid_MUN_CV.png" style="text-decoration: none;">
                    <button>Download Official MUN CV</button>
                </a>
            </div>
        </div>
    </section>

    <script>
        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

        (function initConstellation() {
            const canvas = document.getElementById('bg-canvas-particles');
            const ctx = canvas.getContext('2d');
            let particles = [], mouse = { x: null, y: null };
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
            for (let i = 0; i < 68; i++) {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.55, vy: (Math.random() - 0.5) * 0.55, r: Math.random() * 1.9 + 0.9 });
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(212, 175, 55, 0.85)'; ctx.fill();
                    for (let j = i + 1; j < particles.length; j++) {
                        let p2 = particles[j], d = Math.hypot(p.x - p2.x, p.y - p2.y);
                        if (d < 135) {
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(212, 175, 55, ${0.22 * (1 - d / 135)})`;
                            ctx.lineWidth = 0.9; ctx.stroke();
                        }
                    }
                    if (mouse.x !== null) {
                        let md = Math.hypot(p.x - mouse.x, p.y - mouse.y);
                        if (md < 195) {
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = `rgba(255, 215, 70, ${0.88 * (1 - md / 195)})`;
                            ctx.lineWidth = 1.75; ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
