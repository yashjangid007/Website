    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Fullscreen view">
    </div>

    <section class="content-section">
        <div style="text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">Visual Arts & Graphics</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 40px; font-weight: 500;">
                A curated portfolio of creative execution and graphic design.
            </p>
        </div>
        <div id="gallery-container" class="gallery-grid">
            <p style="text-align: center; width: 100%; color: var(--text-muted);">Synchronizing gallery...</p>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCrR6sGSwG4i8GD3yVi0S7XIVIFA5O3C-8", authDomain: "yash-jangid.firebaseapp.com", projectId: "yash-jangid", storageBucket: "yash-jangid.firebasestorage.app", messagingSenderId: "413356747209", appId: "1:413356747209:web:5b7332a06e3865f6e5a018", measurementId: "G-BR856TNGE8" };
        const db = getFirestore(initializeApp(firebaseConfig));

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }
        function safeURL(url) {
            const raw = String(url || '').trim();
            return /^https?:\/\//i.test(raw) ? raw : encodeURI(raw);
        }

        window.openLightbox = function(url) { document.getElementById('lightbox-img').src = url; document.getElementById('lightbox').style.display = 'flex'; };
        window.closeLightbox = function() { document.getElementById('lightbox').style.display = 'none'; };
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.closeLightbox(); });

        onSnapshot(collection(db, "graphics"), (snapshot) => {
            const container = document.getElementById("gallery-container"); container.innerHTML = ""; 
            let images = []; snapshot.forEach((doc) => { images.push({ id: doc.id, ...doc.data() }); });
            images.sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));
            if(images.length === 0) { container.innerHTML = "<p style='text-align:center; width:100%;'>No graphics uploaded yet.</p>"; return; }
            images.forEach((img) => {
                const sUrl = escapeHTML(safeURL(img.url));
                const sCap = escapeHTML(img.caption || '');
                container.innerHTML += `<div class="graphic-card"><img loading="lazy" src="${sUrl}" alt="${sCap || 'Graphic'}" onclick="window.openLightbox(this.getAttribute('src'))">${sCap ? `<div class="caption">${sCap}</div>` : ''}</div>`;
            });
        });
    </script>
</body>
</html>
